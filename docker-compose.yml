services:
  db:
    # ParadeDB image bundles pg_search (BM25) AND pgvector in one Postgres.
    image: paradedb/paradedb:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contract}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contract}
      POSTGRES_DB: ${POSTGRES_DB:-contract}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contract}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-contract}:${POSTGRES_PASSWORD:-contract}@db:5432/${POSTGRES_DB:-contract}
      REDIS_URL: redis://redis:6379/0
      NOTEBOOKLM_API_URL: http://notebooklm:3000
    volumes:
      - ./backend:/app
      - filedata:/data/files          # raw uploaded documents (local FS, no S3)
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: arq app.workers.main.WorkerSettings
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-contract}:${POSTGRES_PASSWORD:-contract}@db:5432/${POSTGRES_DB:-contract}
      REDIS_URL: redis://redis:6379/0
      NOTEBOOKLM_API_URL: http://notebooklm:3000
    volumes:
      - ./backend:/app
      - filedata:/data/files          # same volume as backend → shared raw files
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # NotebookLM automation server (drives a headed Chrome logged into a Google account and
  # exposes the REST API this app calls). PLACEHOLDER — set image/command to your chosen
  # server (e.g. roomi-fields/notebooklm-mcp). Needs: a persistent Chrome-profile volume for
  # the one-time Google login, and a display (Xvfb) since the VPS is headless.
  # notebooklm:
  #   image: <notebooklm-server-image>   # build roomi-fields/notebooklm-mcp (npm run build && npm run start:http)
  #   environment:
  #     PORT: 3000
  #   volumes:
  #     - nlm_profile:/profile           # persisted Google login (do NOT commit / keep private)
  #     - filedata:/data/files:ro        # REQUIRED: server reads uploads by file_path from disk
  #   ports:
  #     - "127.0.0.1:3000:3000"          # bind to localhost only
  #   # may require: shm_size, an Xvfb entrypoint, or a headed-Chrome base image

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  filedata:
